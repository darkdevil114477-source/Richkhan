<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کلر ٹریڈنگ</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:linear-gradient(135deg,#f5f8ff,#eefbf4);
  font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Nafees Nastaleeq",serif;
}
.card{
  width:min(100%,520px);
  background:#fff;
  border-radius:28px;
  padding:48px 28px 34px;
  text-align:center;
  box-shadow:0 18px 55px rgba(20,40,70,.14);
}
h1{
  margin:0 0 28px;
  color:#123f91;
  font-size:38px;
  line-height:1.8;
  font-weight:700;
}
p{
  margin:0 0 30px;
  color:#202936;
  font-size:27px;
  line-height:2;
  font-weight:600;
}
.arrow{
  font-family:Arial,sans-serif;
  color:#20b85a;
  font-size:42px;
  line-height:1;
  margin-bottom:12px;
  animation:bounce 1s infinite;
}
@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(7px)}
}
.whatsapp{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  width:100%;
  min-height:72px;
  border-radius:20px;
  background:#20c763;
  color:#fff;
  text-decoration:none;
  font-family:Arial,sans-serif;
  font-size:26px;
  font-weight:800;
  box-shadow:0 12px 28px rgba(32,199,99,.30);
}
.number{
  margin-top:14px;
  font-family:Arial,sans-serif;
  direction:ltr;
  color:#667085;
  font-size:17px;
  font-weight:700;
  letter-spacing:.4px;
}
.whatsapp-icon{
  width:38px;
  height:38px;
  border:3px solid #fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}
</style>
</head>
<body>
  <main class="card">
    <h1>کلر ٹریڈنگ میں</h1>
    <p>پرافٹ کرنے کے لیے<br>نیچے دیے گئے واٹس ایپ بٹن پر کلک کریں</p>

    <div class="arrow">↓</div>

    <a class="whatsapp"
       href="https://wa.me/923429853459"
       target="_blank"
       rel="noopener noreferrer">
      <span class="whatsapp-icon">☎</span>
      <span>Send Message</span>
      <span>›</span>
    </a>
    <div class="number">+92 342 9853459</div>
  </main>
</body>
</html>
